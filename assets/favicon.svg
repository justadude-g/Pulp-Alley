<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Pulp Alley Card Maker icon: a tilted character card (name bar with
       Level badge, portrait, two-band stats, health pips) on the app's teal. -->
  <defs>
    <clipPath id="card"><rect x="14" y="8" width="36" height="48" rx="3.5"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0d9488"/>
  <g transform="rotate(-8 32 33)">
    <rect x="14" y="8" width="36" height="48" rx="3.5" fill="#fffdf8"/>
    <g clip-path="url(#card)">
      <rect x="14" y="8" width="36" height="12" fill="#1f2937"/>
      <rect x="14" y="19" width="36" height="1.6" fill="#f6930a"/>
      <rect x="31" y="22.5" width="19" height="9.6" fill="#e0885a"/>
      <rect x="31" y="32.1" width="19" height="9.6" fill="#b9a99b"/>
      <rect x="14" y="22.5" width="17" height="19.2" fill="#d6c7a8"/>
      <rect x="14" y="48" width="36" height="8" fill="#c4b27a"/>
    </g>
    <circle cx="23" cy="14" r="5.4" fill="#f6930a" stroke="#fffdf8" stroke-width="1.6"/>
    <circle cx="23" cy="14" r="2.3" fill="#fffdf8"/>
    <rect x="29" y="12.6" width="15" height="2.8" rx="1.4" fill="#e5e7eb"/>
    <rect x="18" y="49.6" width="6" height="4.8" rx="2.4" fill="#e0885a"/>
    <rect x="26" y="49.6" width="6" height="4.8" rx="2.4" fill="#e0885a"/>
    <rect x="34" y="49.6" width="12" height="4.8" rx="2.4" fill="#fffdf8"/>
  </g>
</svg>
